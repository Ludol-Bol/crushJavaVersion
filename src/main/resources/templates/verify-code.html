<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Подтверждение | CrushVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #684F66;
            background: linear-gradient(135deg, #E0D4E8 21%, #A4798D 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .verify-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            animation: fadeIn 0.5s ease;
            text-align: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            color: #684F66;
            letter-spacing: 1px;
        }

        .logo .heart {
            color: #A4798D;
            font-size: 32px;
            margin-right: 8px;
        }

        .logo .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .info-text {
            color: #666;
            margin-bottom: 25px;
            line-height: 1.6;
            font-size: 14px;
        }

        .info-text strong {
            color: #684F66;
        }

        .code-input-group {
            margin-bottom: 25px;
        }

        .code-inputs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .code-digit {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            font-family: 'Roboto', sans-serif;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            transition: all 0.3s ease;
            background: #fafafa;
            color: #684F66;
        }

        .code-digit:focus {
            border-color: #684F66;
            background: white;
            box-shadow: 0 0 0 3px rgba(104, 79, 102, 0.15);
        }

        .code-digit.error {
            border-color: #e74c3c;
            animation: shake 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .timer {
            background: #f5f0f2;
            padding: 10px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 14px;
            color: #684F66;
        }

        .timer span {
            font-weight: 700;
            font-size: 18px;
            color: #A4798D;
        }

        .resend-btn {
            background: none;
            border: none;
            color: #684F66;
            cursor: pointer;
            font-size: 14px;
            margin: 10px 0;
            text-decoration: underline;
            font-family: 'Roboto', sans-serif;
            transition: color 0.3s ease;
        }

        .resend-btn:hover {
            color: #A4798D;
        }

        .resend-btn:disabled {
            color: #b8a0b0;
            cursor: not-allowed;
            text-decoration: none;
        }

        .verify-btn {
            width: 100%;
            padding: 13px;
            background: #E0D4E8;
            color: #684F66;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            min-height: 50px;
        }

        .verify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(164, 121, 141, 0.35);
        }

        .verify-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== СПИННЕР (загрузка) ===== */
        .btn-loading {
            position: relative;
            color: transparent !important;
            pointer-events: none;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 22px;
            margin: -11px 0 0 -11px;
            border: 3px solid rgba(104, 79, 102, 0.2);
            border-top: 3px solid #684F66;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 14px;
        }

        .back-link a {
            color: #684F66;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            font-family: 'Roboto', sans-serif;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .message.info {
            background: #e3f2fd;
            color: #1976d2;
            display: block;
        }

        @media (max-width: 480px) {
            .verify-container {
                padding: 30px 20px;
            }
            .code-digit {
                width: 40px;
                height: 50px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
<div class="verify-container">
    <div class="logo">
        <h1>
            <span class="heart">💕</span>
            <span class="title">Подтверждение</span>
        </h1>
    </div>

    <div class="info-text">
        Введите 6-значный код из письма, отправленного на <br>
        <strong id="userEmail">loading...</strong>
    </div>

    <div class="code-input-group">
        <div class="code-inputs">
            <input type="text" class="code-digit" maxlength="1" id="digit1" autofocus>
            <input type="text" class="code-digit" maxlength="1" id="digit2">
            <input type="text" class="code-digit" maxlength="1" id="digit3">
            <input type="text" class="code-digit" maxlength="1" id="digit4">
            <input type="text" class="code-digit" maxlength="1" id="digit5">
            <input type="text" class="code-digit" maxlength="1" id="digit6">
        </div>
    </div>

    <div class="timer" id="timerArea">
        Код действителен: <span id="timer">05:00</span>
    </div>

    <button class="resend-btn" id="resendBtn" onclick="resendCode()">
        Отправить код повторно
    </button>

    <button class="verify-btn" id="verifyBtn" onclick="verifyCode()">
        Подтвердить
    </button>

    <div class="back-link">
        <a href="/register">← Вернуться к регистрации</a>
    </div>
</div>

<script>
    let email = '';
    let nickname = '';
    let birthDate = '';
    let password = '';
    let timerInterval;
    let timeLeft = 300;

    window.onload = function() {
        email = localStorage.getItem('reg_email') || '';
        nickname = localStorage.getItem('reg_nickname') || '';
        birthDate = localStorage.getItem('reg_birthDate') || '';
        password = localStorage.getItem('reg_password') || '';

        if (!email) {
            showMessage('Ошибка: данные не найдены. Пожалуйста, зарегистрируйтесь заново.', 'error');
            setTimeout(() => {
                window.location.href = '/register';
            }, 2000);
            return;
        }

        document.getElementById('userEmail').textContent = email;

        // Код уже отправлен из register.html, не отправляем повторно
        startTimer();
        setupCodeInputs();
    };

    async function resendCode() {
        const resendBtn = document.getElementById('resendBtn');
        resendBtn.disabled = true;
        resendBtn.textContent = 'Отправка...';

        try {
            const response = await fetch('/api/send-verification', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: email,
                    nickname: nickname,
                    birthDate: birthDate,
                    password: password
                })
            });

            const result = await response.json();

            if (result.success) {
                showMessage('Новый код отправлен на ' + email, 'success');
                resetTimer();
            } else {
                showMessage(result.message || 'Ошибка отправки кода', 'error');
                resendBtn.disabled = false;
                resendBtn.textContent = 'Отправить код повторно';
            }
        } catch (error) {
            console.error('Ошибка:', error);
            showMessage('Ошибка соединения с сервером', 'error');
            resendBtn.disabled = false;
            resendBtn.textContent = 'Отправить код повторно';
        }
    }

    async function verifyCode() {
        const code =
            document.getElementById('digit1').value +
            document.getElementById('digit2').value +
            document.getElementById('digit3').value +
            document.getElementById('digit4').value +
            document.getElementById('digit5').value +
            document.getElementById('digit6').value;

        if (code.length !== 6) {
            showMessage('Введите 6-значный код', 'error');
            return;
        }

        const verifyBtn = document.getElementById('verifyBtn');
        verifyBtn.disabled = true;
        verifyBtn.classList.add('btn-loading');

        try {
            const response = await fetch('/api/verify-and-register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: email,
                    nickname: nickname,
                    birthDate: birthDate,
                    password: password,
                    verificationCode: code
                })
            });

            const result = await response.json();

            if (result.success) {
                showMessage('Регистрация успешна! Перенаправление...', 'success');
                clearInterval(timerInterval);
                localStorage.removeItem('reg_email');
                localStorage.removeItem('reg_nickname');
                localStorage.removeItem('reg_birthDate');
                localStorage.removeItem('reg_password');

                setTimeout(() => {
                    window.location.href = '/profile';
                }, 2000);
            } else {
                showMessage(result.message || 'Неверный код', 'error');
                clearCodeInputs();
                verifyBtn.disabled = false;
                verifyBtn.classList.remove('btn-loading');
            }
        } catch (error) {
            console.error('Ошибка:', error);
            showMessage('Ошибка соединения с сервером', 'error');
            verifyBtn.disabled = false;
            verifyBtn.classList.remove('btn-loading');
        }
    }

    function setupCodeInputs() {
        const inputs = document.querySelectorAll('.code-digit');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                if (e.target.value.length === 1 && index < 5) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && index > 0 && !input.value) {
                    inputs[index - 1].focus();
                }
            });
        });
    }

    function clearCodeInputs() {
        for (let i = 1; i <= 6; i++) {
            const input = document.getElementById('digit' + i);
            input.value = '';
            input.classList.remove('error');
        }
        document.getElementById('digit1').focus();
    }

    function showMessage(text, type) {
        const messageDiv = document.getElementById('message');
        messageDiv.textContent = text;
        messageDiv.className = 'message ' + type;
        messageDiv.style.display = 'block';
        setTimeout(() => {
            messageDiv.style.display = 'none';
        }, 5000);
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timer').textContent = '00:00';
                document.getElementById('resendBtn').disabled = false;
                document.getElementById('resendBtn').textContent = 'Код истек. Отправить повторно';
                showMessage('Срок действия кода истек. Запросите новый код.', 'error');
            } else {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }, 1000);
        document.getElementById('resendBtn').disabled = true;
        document.getElementById('resendBtn').textContent = 'Отправить код повторно (доступно через 5 мин)';
    }

    function resetTimer() {
        timeLeft = 300;
        clearInterval(timerInterval);
        startTimer();
    }
</script>
</body>
</html>
