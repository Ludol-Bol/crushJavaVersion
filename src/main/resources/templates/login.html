<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | CrushVerse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 40px 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .password-toggle {
            position: absolute;
            right: 12px;
            cursor: pointer;
            user-select: none;
            font-size: 20px;
            color: #999;
            transition: color 0.3s ease;
        }

        .password-toggle:hover {
            color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .remember-me span {
            color: #666;
            font-size: 14px;
        }

        .forgot-password {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .register-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #666;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
<div class="login-container">
    <div class="logo">
        <h1>💕 CrushVerse</h1>
    </div>

    <div id="errorMessage" class="error-message"></div>

    <form id="loginForm">
        <div class="form-group">
            <label for="username">Логин или Email</label>
            <div class="input-wrapper">
                <input type="text" id="username" name="username"
                       placeholder="Введите ваш логин или email" required>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <div class="input-wrapper">
                <input type="password" id="password" name="password"
                       placeholder="Введите пароль" required>
                <span class="password-toggle" onclick="togglePassword()">
                        👁️
                    </span>
            </div>
        </div>

        <div class="checkbox-group">
            <label class="remember-me">
                <input type="checkbox" id="rememberMe">
                <span>Запомнить меня</span>
            </label>
            <a href="#" class="forgot-password">Забыли пароль?</a>
        </div>

        <button type="submit" class="login-btn">Войти</button>
    </form>

    <div class="register-link">
        Нет аккаунта? <a href="/register">Зарегистрироваться</a>
    </div>
</div>

<script>
    // Показать/скрыть пароль
    function togglePassword() {
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.querySelector('.password-toggle');

        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            toggleIcon.textContent = '🙈';
        } else {
            passwordInput.type = 'password';
            toggleIcon.textContent = '👁️';
        }
    }

    // ===== АВТОВХОД (ПРОВЕРКА ТОКЕНА ПРИ ЗАГРУЗКЕ) =====
    async function checkAutoLogin() {
        try {
            const response = await fetch('/api/check-auto-login');
            const data = await response.json();

            if (data.authenticated && data.redirectUrl) {
                // Автоматически перенаправляем на дашборд
                window.location.href = data.redirectUrl;
            }
        } catch (error) {
            console.error('Ошибка проверки автовхода:', error);
        }
    }

    // ===== ЗАПОМНИТЬ МЕНЯ (сохраняем логин для удобства) =====
    function loadSavedUsername() {
        const savedUsername = localStorage.getItem('rememberedUsername');
        const rememberMe = localStorage.getItem('rememberMeChecked');

        if (savedUsername) {
            document.getElementById('username').value = savedUsername;
        }

        if (rememberMe === 'true') {
            document.getElementById('rememberMe').checked = true;
        }
    }

    function saveUsernameIfNeeded() {
        const rememberMe = document.getElementById('rememberMe').checked;
        const username = document.getElementById('username').value;

        if (rememberMe) {
            localStorage.setItem('rememberedUsername', username);
            localStorage.setItem('rememberMeChecked', 'true');
        } else {
            localStorage.removeItem('rememberedUsername');
            localStorage.setItem('rememberMeChecked', 'false');
        }
    }

    // Обработка отправки формы
    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        const rememberMe = document.getElementById('rememberMe').checked;

        if (!username || !password) {
            showError('Пожалуйста, заполните все поля');
            return;
        }

        // Сохраняем логин в localStorage (только для подстановки в поле)
        saveUsernameIfNeeded();

        console.log('Данные для входа:', {username, password, rememberMe});

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    username: username,
                    password: password,
                    rememberMe: rememberMe
                })
            });

            const data = await response.json();

            if (data.success) {
                window.location.href = data.redirectUrl || '/main-page';
            } else {
                showError(data.message || 'Неверный логин или пароль');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Войти';
            }
        } catch (error) {
            console.error('Ошибка:', error);
            showError('Ошибка соединения с сервером');
            submitBtn.disabled = false;
            submitBtn.textContent = 'Войти';
        }
    });

    function showError(message) {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = message;
        errorDiv.classList.add('show');
        setTimeout(() => {
            errorDiv.classList.remove('show');
        }, 5000);
    }

    // ===== ЗАПУСК ПРИ ЗАГРУЗКЕ СТРАНИЦЫ =====
    // 1. Проверяем, нет ли уже активного токена (автовход)
    checkAutoLogin();

    // 2. Подставляем сохранённый логин (если есть)
    loadSavedUsername();
</script>
</body>
</html>
