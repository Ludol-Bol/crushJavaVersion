version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: crush-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  app:
    build: .
    container_name: crush-app
    ports:
      - "8080:8080"
      - "5005:5005"
    depends_on:
      - redis
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
    restart: unless-stopped