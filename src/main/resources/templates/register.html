<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | CrushVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #684F66;
            background: linear-gradient(135deg, #E0D4E8 21%, #A4798D 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .register-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            color: #684F66;
            letter-spacing: 1px;
        }

        .logo .heart {
            color: #A4798D;
            font-size: 32px;
            margin-right: 8px;
        }

        .logo .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
            color: #684F66;
        }

        .form-group label .required {
            color: #e74c3c;
            margin-left: 3px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Roboto', sans-serif;
            transition: all 0.3s ease;
            outline: none;
            background: #fafafa;
            color: #684F66;
        }

        .input-wrapper input:focus {
            border-color: #684F66;
            background: white;
            box-shadow: 0 0 0 3px rgba(104, 79, 102, 0.15);
        }

        .input-wrapper input::placeholder {
            color: #b8a0b0;
        }

        .input-wrapper input.error {
            border-color: #e74c3c;
        }

        .error-text {
            color: #e74c3c;
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }

        .success-text {
            color: #27ae60;
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }

        .password-strength {
            height: 4px;
            margin-top: 8px;
            border-radius: 2px;
            transition: all 0.3s ease;
        }

        .weak { background: #e74c3c; width: 33%; }
        .medium { background: #f39c12; width: 66%; }
        .strong { background: #27ae60; width: 100%; }

        .register-btn {
            width: 100%;
            padding: 13px;
            background: #E0D4E8;
            color: #684F66;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            min-height: 50px;
        }

        .register-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(164, 121, 141, 0.35);
        }

        .register-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* ===== СПИННЕР (загрузка) ===== */
        .btn-loading {
            position: relative;
            color: transparent !important;
            pointer-events: none;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 22px;
            margin: -11px 0 0 -11px;
            border: 3px solid rgba(104, 79, 102, 0.2);
            border-top: 3px solid #684F66;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .login-link {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            color: #666;
            font-size: 14px;
        }

        .login-link a {
            color: #684F66;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
            display: none;
            font-family: 'Roboto', sans-serif;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="logo">
        <h1>
            <span class="heart">💕</span>
            <span class="title">Регистрация</span>
        </h1>
    </div>

    <div id="message" class="message"></div>

    <form id="registerForm">
        <div class="form-group">
            <label for="email">Email <span class="required">*</span></label>
            <div class="input-wrapper">
                <input type="email" id="email" placeholder="example@mail.com">
            </div>
            <span class="error-text" id="emailError"></span>
        </div>

        <div class="form-group">
            <label for="nickname">Никнейм <span class="required">*</span></label>
            <div class="input-wrapper">
                <input type="text" id="nickname" placeholder="Ваш уникальный никнейм">
            </div>
            <span class="error-text" id="nicknameError"></span>
            <span class="success-text" id="nicknameOk"></span>
        </div>

        <div class="form-group">
            <label for="password">Пароль <span class="required">*</span></label>
            <div class="input-wrapper">
                <input type="password" id="password" placeholder="Минимум 6 символов">
            </div>
            <div class="password-strength" id="passwordStrength"></div>
            <span class="error-text" id="passwordError"></span>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Подтверждение пароля <span class="required">*</span></label>
            <div class="input-wrapper">
                <input type="password" id="confirmPassword" placeholder="Повторите пароль">
            </div>
            <span class="error-text" id="confirmError"></span>
        </div>

        <button type="submit" class="register-btn" id="submitBtn">Зарегистрироваться</button>
    </form>

    <div class="login-link">
        Уже есть аккаунт? <a href="/login">Войти</a>
    </div>
</div>

<script>
    function checkPasswordStrength(password) {
        let strength = 0;
        if (password.length >= 6) strength++;
        if (password.length >= 10) strength++;
        if (/[A-Z]/.test(password)) strength++;
        if (/[0-9]/.test(password)) strength++;
        if (/[^A-Za-z0-9]/.test(password)) strength++;

        const strengthDiv = document.getElementById('passwordStrength');
        strengthDiv.className = 'password-strength';

        if (password.length === 0) {
            strengthDiv.style.background = 'transparent';
            strengthDiv.style.width = '0%';
            return 0;
        }

        if (strength <= 2) {
            strengthDiv.classList.add('weak');
            return 1;
        } else if (strength <= 4) {
            strengthDiv.classList.add('medium');
            return 2;
        } else {
            strengthDiv.classList.add('strong');
            return 3;
        }
    }

    function showMessage(text, type) {
        const messageDiv = document.getElementById('message');
        messageDiv.textContent = text;
        messageDiv.className = 'message ' + type;
        setTimeout(() => {
            messageDiv.style.display = 'none';
            messageDiv.className = 'message';
        }, 5000);
    }

    function validateEmail(email) {
        return /^[^\s@]+@([^\s@]+\.)+[^\s@]+$/.test(email);
    }

    function validateNickname(nickname) {
        return /^[a-zA-Z0-9_-]{3,20}$/.test(nickname);
    }

    function validateForm() {
        let isValid = true;

        const email = document.getElementById('email').value.trim();
        const emailError = document.getElementById('emailError');
        if (!email) {
            emailError.textContent = 'Введите email';
            isValid = false;
        } else if (!validateEmail(email)) {
            emailError.textContent = 'Введите корректный email';
            isValid = false;
        } else {
            emailError.textContent = '';
        }

        const nickname = document.getElementById('nickname').value.trim();
        const nicknameError = document.getElementById('nicknameError');
        const nicknameOk = document.getElementById('nicknameOk');
        if (!nickname) {
            nicknameError.textContent = 'Введите никнейм';
            nicknameOk.textContent = '';
            isValid = false;
        } else if (!validateNickname(nickname)) {
            nicknameError.textContent = 'Никнейм должен содержать 3-20 символов (буквы, цифры, _, -)';
            nicknameOk.textContent = '';
            isValid = false;
        } else {
            nicknameError.textContent = '';
            nicknameOk.textContent = '✓ Доступен';
        }

        const password = document.getElementById('password').value;
        const passwordError = document.getElementById('passwordError');
        if (!password) {
            passwordError.textContent = 'Введите пароль';
            isValid = false;
        } else if (password.length < 6) {
            passwordError.textContent = 'Пароль должен содержать минимум 6 символов';
            isValid = false;
        } else {
            passwordError.textContent = '';
        }

        const confirmPassword = document.getElementById('confirmPassword').value;
        const confirmError = document.getElementById('confirmError');
        if (!confirmPassword) {
            confirmError.textContent = 'Подтвердите пароль';
            isValid = false;
        } else if (password !== confirmPassword) {
            confirmError.textContent = 'Пароли не совпадают';
            isValid = false;
        } else {
            confirmError.textContent = '';
        }

        return isValid;
    }

    // Живая проверка полей
    document.getElementById('nickname').addEventListener('input', function() {
        const nickname = this.value.trim();
        const errorDiv = document.getElementById('nicknameError');
        const okDiv = document.getElementById('nicknameOk');
        if (nickname && !validateNickname(nickname)) {
            errorDiv.textContent = 'Никнейм должен содержать 3-20 символов (буквы, цифры, _, -)';
            okDiv.textContent = '';
        } else if (nickname && validateNickname(nickname)) {
            errorDiv.textContent = '';
            okDiv.textContent = '✓ Доступен';
        } else {
            errorDiv.textContent = '';
            okDiv.textContent = '';
        }
    });

    document.getElementById('password').addEventListener('input', function() {
        const password = this.value;
        checkPasswordStrength(password);

        const confirmPassword = document.getElementById('confirmPassword').value;
        const confirmError = document.getElementById('confirmError');
        if (confirmPassword && password !== confirmPassword) {
            confirmError.textContent = 'Пароли не совпадают';
        } else if (confirmPassword) {
            confirmError.textContent = '';
        }

        const passwordError = document.getElementById('passwordError');
        if (password && password.length < 6) {
            passwordError.textContent = 'Пароль должен содержать минимум 6 символов';
        } else {
            passwordError.textContent = '';
        }
    });

    document.getElementById('confirmPassword').addEventListener('input', function() {
        const password = document.getElementById('password').value;
        const confirmError = document.getElementById('confirmError');
        if (this.value !== password) {
            confirmError.textContent = 'Пароли не совпадают';
        } else {
            confirmError.textContent = '';
        }
    });

    // Проверка email при потере фокуса
    document.getElementById('email').addEventListener('blur', async function() {
        const email = this.value.trim();
        const errorDiv = document.getElementById('emailError');

        if (!email) {
            errorDiv.textContent = 'Введите email';
            return;
        }

        if (!validateEmail(email)) {
            errorDiv.textContent = 'Введите корректный email';
            return;
        }

        try {
            const response = await fetch('/api/check-email?email=' + encodeURIComponent(email));
            const result = await response.json();

            if (result.exists) {
                errorDiv.textContent = result.message || 'Пользователь с таким email уже существует';
                this.classList.add('error');
            } else {
                errorDiv.textContent = '';
                this.classList.remove('error');
            }
        } catch (error) {
            console.error('Ошибка проверки email:', error);
        }
    });

    document.getElementById('email').addEventListener('input', function() {
        const errorDiv = document.getElementById('emailError');
        if (errorDiv.textContent === 'Пользователь с таким email уже существует' ||
            errorDiv.textContent === 'Введите корректный email') {
            const email = this.value.trim();
            if (validateEmail(email)) {
                errorDiv.textContent = '';
                this.classList.remove('error');
            }
        }
    });

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        if (!validateForm()) {
            showMessage('Пожалуйста, исправьте ошибки в форме', 'error');
            return;
        }

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.classList.add('btn-loading');

        const formData = {
            email: document.getElementById('email').value.trim(),
            nickname: document.getElementById('nickname').value.trim(),
            password: document.getElementById('password').value,
            confirmPassword: document.getElementById('confirmPassword').value
        };

        try {
            const response = await fetch('/api/send-verification', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            const result = await response.json();

            if (result.success) {
                localStorage.setItem('reg_email', formData.email);
                localStorage.setItem('reg_nickname', formData.nickname);
                localStorage.setItem('reg_password', formData.password);

                showMessage(result.message, 'success');
                submitBtn.classList.remove('btn-loading');
                setTimeout(() => window.location.href = '/verify-code', 1500);
            } else {
                showMessage(result.message || 'Ошибка при отправке кода', 'error');
                submitBtn.disabled = false;
                submitBtn.classList.remove('btn-loading');
            }
        } catch (error) {
            showMessage('Ошибка соединения с сервером', 'error');
            submitBtn.disabled = false;
            submitBtn.classList.remove('btn-loading');
        }
    });
</script>
</body>
</html>
