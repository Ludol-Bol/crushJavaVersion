<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${title}">CrushVerse</title>
        <style>
            * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            }

            body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            }

            .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            text-align: center;
            }

            h1 {
            color: #667eea;
            font-size: 2.5em;
            margin-bottom: 10px;
            }

            .subtitle {
            color: #764ba2;
            font-size: 1.2em;
            margin-bottom: 30px;
            }

            .status {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: bold;
            }

            .message {
            background: #f3e5f5;
            color: #4a148c;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            font-size: 1.1em;
            }

            .time {
            color: #666;
            font-size: 0.9em;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            }

            .footer {
            margin-top: 20px;
            color: #999;
            font-size: 0.8em;
            }

            .heart {
            color: #e91e63;
            font-size: 1.2em;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>💜 CrushVerse</h1>
            <div class="subtitle">Твоё пространство для вдохновения</div>

            <div class="status" th:text="${status}">Статус</div>

            <div class="message" th:text="${message}">
                Сообщение
            </div>

            <div class="time">
                🕐 <span th:text="${time}">время</span>
            </div>
        </div>
    </body>
</html>
