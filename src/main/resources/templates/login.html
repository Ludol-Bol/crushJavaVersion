<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | CrushVerse</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #684F66;
            background: linear-gradient(135deg, #E0D4E8 21%, #A4798D 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 28px;
            color: #684F66;
            line-height: 1.2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .heart {
            color: #A4798D;
            font-size: 32px;
            margin-right: 8px;
        }

        .title {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .logo-image {
            display: block;
            margin: 10px auto 0;
            height: 120px;
            width: auto;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 14px;
            color: #684F66;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 15px;
            font-family: 'Roboto', sans-serif;
            transition: all 0.3s ease;
            outline: none;
            background: #fafafa;
            color: #684F66;
        }

        .input-wrapper input:focus {
            border-color: #684F66;
            background: white;
            box-shadow: 0 0 0 3px rgba(104, 79, 102, 0.15);
        }

        .input-wrapper input::placeholder {
            color: #b8a0b0;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 20px 0 25px 0;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            color: #555;
            font-size: 14px;
        }

        .remember-me input {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: #684F66;
        }

        .forgot-password {
            color: #684F66;
            font-size: 14px;
            cursor: pointer;
            background: none;
            border: none;
            font-family: 'Roboto', sans-serif;
            transition: color 0.3s ease;
        }

        .forgot-password:hover {
            color: #A4798D;
            text-decoration: underline;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 5px;
        }

        .btn-group .btn {
            flex: 1;
            padding: 13px 10px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Roboto', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            min-height: 48px;
        }

        .btn-login {
            background: #E0D4E8;
            color: #684F66;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(164, 121, 141, 0.35);
        }

        .btn-login:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-register {
            background: #E0D4E8;
            color: #684F66;
        }

        .btn-register:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(164, 121, 141, 0.35);
        }

        .btn-loading {
            position: relative;
            color: transparent !important;
            pointer-events: none;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 22px;
            height: 22px;
            margin: -11px 0 0 -11px;
            border: 3px solid rgba(104, 79, 102, 0.2);
            border-top: 3px solid #684F66;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #e74c3c;
            font-family: 'Roboto', sans-serif;
        }

        .error-message.show {
            display: block;
        }

        .version {
            text-align: center;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #f0f0f0;
            font-size: 12px;
            color: #b8a0b0;
            font-family: 'Roboto', sans-serif;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
            .btn-group {
                flex-direction: column;
            }
            .logo-image {
                height: 80px;
            }
        }
    </style>
</head>
<body>
<div class="login-container">

    <div class="logo">
        <h1>
            <span class="heart">💕</span>
            <span class="title">CrushVerse</span>
        </h1>
        <img src="/images/startPhoto.png" alt="CrushVerse" style="height: 300px; width: auto; margin-top: 15px;">
    </div>

    <div id="errorMessage" class="error-message"></div>

    <form id="loginForm">

        <div class="form-group">
            <label for="username">Email или Никнейм</label>
            <div class="input-wrapper">
                <input type="text" id="username" name="username"
                       placeholder="Введите email или никнейм" required>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Пароль</label>
            <div class="input-wrapper">
                <input type="password" id="password" name="password"
                       placeholder="Введите пароль" required>
            </div>
        </div>

        <div class="checkbox-group">
            <label class="remember-me">
                <input type="checkbox" id="rememberMe" checked>
                <span>Запомнить меня</span>
            </label>
            <button type="button" class="forgot-password" onclick="goToForgotPassword()">
                Забыли пароль?
            </button>
        </div>

        <div class="btn-group">
            <button type="submit" class="btn btn-login" id="submitBtn">Вход</button>
            <button type="button" class="btn btn-register" onclick="goToRegister()">Регистрация</button>
        </div>

    </form>

    <div class="version">Версия 0.1</div>

</div>

<script>
    function goToRegister() {
        window.location.href = '/register';
    }

    function goToForgotPassword() {
        window.location.href = '/forgot-password';
    }

    async function checkAutoLogin() {
        try {
            const response = await fetch('/api/check-auto-login');
            const data = await response.json();
            if (data.authenticated && data.redirectUrl) {
                window.location.href = data.redirectUrl;
            }
        } catch (error) {
            console.error('Ошибка проверки автовхода:', error);
        }
    }

    function loadSavedUsername() {
        const savedUsername = localStorage.getItem('rememberedUsername');
        const rememberMe = localStorage.getItem('rememberMeChecked');

        if (savedUsername) {
            document.getElementById('username').value = savedUsername;
        }
        if (rememberMe === 'true') {
            document.getElementById('rememberMe').checked = true;
        }
    }

    function saveUsernameIfNeeded() {
        const rememberMe = document.getElementById('rememberMe').checked;
        const username = document.getElementById('username').value;

        if (rememberMe) {
            localStorage.setItem('rememberedUsername', username);
            localStorage.setItem('rememberMeChecked', 'true');
        } else {
            localStorage.removeItem('rememberedUsername');
            localStorage.setItem('rememberMeChecked', 'false');
        }
    }

    document.getElementById('loginForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const rememberMe = document.getElementById('rememberMe').checked;
        const submitBtn = document.getElementById('submitBtn');

        if (!username || !password) {
            showError('Пожалуйста, заполните все поля');
            return;
        }

        saveUsernameIfNeeded();

        submitBtn.disabled = true;
        submitBtn.classList.add('btn-loading');

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, rememberMe })
            });

            const data = await response.json();

            if (data.success) {
                window.location.href = data.redirectUrl || '/main-page';
            } else {
                showError(data.message || 'Неверный логин или пароль');
                submitBtn.disabled = false;
                submitBtn.classList.remove('btn-loading');
            }
        } catch (error) {
            console.error('Ошибка:', error);
            showError('Ошибка соединения с сервером');
            submitBtn.disabled = false;
            submitBtn.classList.remove('btn-loading');
        }
    });

    function showError(message) {
        const errorDiv = document.getElementById('errorMessage');
        errorDiv.textContent = message;
        errorDiv.classList.add('show');
        setTimeout(() => {
            errorDiv.classList.remove('show');
        }, 5000);
    }
    checkAutoLogin();
    loadSavedUsername();
</script>
</body>
</html>
