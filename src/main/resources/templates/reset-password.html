<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сброс пароля | CrushVerse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
            padding: 40px;
            animation: fadeIn 0.5s ease;
            text-align: center;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }

        h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .step {
            display: none;
        }

        .step.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .code-inputs {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 20px 0;
        }

        .code-digit {
            width: 55px;
            height: 70px;
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            outline: none;
            transition: all 0.3s ease;
        }

        .code-digit:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #95a5a6;
            margin-top: 10px;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .back-link {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .message {
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .timer {
            font-size: 14px;
            color: #666;
            margin: 10px 0;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">
        <h1>💕 CrushVerse</h1>
    </div>

    <!-- ШАГ 1: Ввод кода -->
    <div id="step1" class="step active">
        <h2>Введите код</h2>
        <div class="subtitle">Код отправлен на <strong id="userEmail">email</strong></div>

        <div id="message1" class="message"></div>

        <div class="code-inputs">
            <input type="text" class="code-digit" maxlength="1" id="digit1" autofocus>
            <input type="text" class="code-digit" maxlength="1" id="digit2">
            <input type="text" class="code-digit" maxlength="1" id="digit3">
            <input type="text" class="code-digit" maxlength="1" id="digit4">
            <input type="text" class="code-digit" maxlength="1" id="digit5">
            <input type="text" class="code-digit" maxlength="1" id="digit6">
        </div>

        <div class="timer" id="timer">Код действителен: 05:00</div>

        <button class="btn" id="verifyBtn" onclick="verifyCode()">Подтвердить</button>
        <button class="btn btn-secondary" onclick="resendCode()">Отправить код повторно</button>
    </div>

    <!-- ШАГ 2: Новый пароль -->
    <div id="step2" class="step">
        <h2>Новый пароль</h2>
        <div class="subtitle">Придумайте новый пароль</div>

        <div id="message2" class="message"></div>

        <div class="form-group">
            <label>Новый пароль</label>
            <input type="password" id="newPassword" placeholder="Минимум 6 символов">
        </div>

        <div class="form-group">
            <label>Подтверждение пароля</label>
            <input type="password" id="confirmPassword" placeholder="Повторите пароль">
        </div>

        <button class="btn" id="resetBtn" onclick="resetPassword()">Сменить пароль</button>
    </div>

    <div class="back-link">
        <a href="/login">← Вернуться ко входу</a>
    </div>
</div>

<script>
    let email = '';
    let timerInterval;
    let timeLeft = 300;

    window.onload = function() {
        email = localStorage.getItem('reset_email') || '';
        if (!email) {
            window.location.href = '/forgot-password';
            return;
        }
        document.getElementById('userEmail').innerText = email;
        startTimer();
        setupCodeInputs();
    };

    function setupCodeInputs() {
        const inputs = document.querySelectorAll('.code-digit');
        inputs.forEach((input, index) => {
            input.addEventListener('input', (e) => {
                e.target.value = e.target.value.replace(/[^0-9]/g, '');
                if (e.target.value.length === 1 && index < 5) {
                    inputs[index + 1].focus();
                }
            });
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && index > 0 && !input.value) {
                    inputs[index - 1].focus();
                }
            });
        });
    }

    async function verifyCode() {
        const code =
            document.getElementById('digit1').value +
            document.getElementById('digit2').value +
            document.getElementById('digit3').value +
            document.getElementById('digit4').value +
            document.getElementById('digit5').value +
            document.getElementById('digit6').value;

        const verifyBtn = document.getElementById('verifyBtn');

        if (code.length !== 6) {
            showMessage('Введите 6-значный код', 'error', 'message1');
            return;
        }

        verifyBtn.disabled = true;
        verifyBtn.textContent = 'Проверка...';

        try {
            const response = await fetch('/api/verify-reset-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email, code: code })
            });

            const data = await response.json();

            if (data.success) {
                clearInterval(timerInterval);
                showMessage('Код подтверждён!', 'success', 'message1');

                // Переключаем на второй шаг
                document.getElementById('step1').classList.remove('active');
                document.getElementById('step2').classList.add('active');
            } else {
                showMessage(data.message || 'Неверный код', 'error', 'message1');
                verifyBtn.disabled = false;
                verifyBtn.textContent = 'Подтвердить';
                clearCodeInputs();
            }
        } catch (error) {
            console.error('Ошибка:', error);
            showMessage('Ошибка соединения с сервером', 'error', 'message1');
            verifyBtn.disabled = false;
            verifyBtn.textContent = 'Подтвердить';
        }
    }

    async function resendCode() {
        const resendBtn = document.querySelector('.btn-secondary');
        resendBtn.disabled = true;
        resendBtn.textContent = 'Отправка...';

        try {
            const response = await fetch('/api/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });

            const data = await response.json();

            if (data.success) {
                showMessage('Новый код отправлен на почту', 'success', 'message1');
                resetTimer();
                clearCodeInputs();
            } else {
                showMessage(data.message, 'error', 'message1');
            }
            resendBtn.disabled = false;
            resendBtn.textContent = 'Отправить код повторно';
        } catch (error) {
            showMessage('Ошибка соединения с сервером', 'error', 'message1');
            resendBtn.disabled = false;
            resendBtn.textContent = 'Отправить код повторно';
        }
    }

    async function resetPassword() {
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const resetBtn = document.getElementById('resetBtn');

        if (!newPassword || !confirmPassword) {
            showMessage('Заполните все поля', 'error', 'message2');
            return;
        }

        if (newPassword.length < 6) {
            showMessage('Пароль должен быть минимум 6 символов', 'error', 'message2');
            return;
        }

        if (newPassword !== confirmPassword) {
            showMessage('Пароли не совпадают', 'error', 'message2');
            return;
        }

        resetBtn.disabled = true;
        resetBtn.textContent = 'Смена пароля...';

        try {
            const response = await fetch('/api/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    email: email,
                    newPassword: newPassword,
                    confirmPassword: confirmPassword
                })
            });

            const data = await response.json();

            if (data.success) {
                showMessage(data.message, 'success', 'message2');
                localStorage.removeItem('reset_email');
                setTimeout(() => {
                    window.location.href = data.redirectUrl || '/login';
                }, 2000);
            } else {
                showMessage(data.message, 'error', 'message2');
                resetBtn.disabled = false;
                resetBtn.textContent = 'Сменить пароль';
            }
        } catch (error) {
            showMessage('Ошибка соединения с сервером', 'error', 'message2');
            resetBtn.disabled = false;
            resetBtn.textContent = 'Сменить пароль';
        }
    }

    function showMessage(text, type, elementId) {
        const msgDiv = document.getElementById(elementId);
        msgDiv.textContent = text;
        msgDiv.className = 'message ' + type;
        setTimeout(() => {
            msgDiv.style.display = 'none';
            msgDiv.className = 'message';
        }, 5000);
    }

    function startTimer() {
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                document.getElementById('timer').textContent = 'Код истек. Запросите новый';
                document.getElementById('verifyBtn').disabled = true;
            } else {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                document.getElementById('timer').textContent = `Код действителен: ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }, 1000);
    }

    function resetTimer() {
        timeLeft = 300;
        clearInterval(timerInterval);
        startTimer();
    }

    function clearCodeInputs() {
        for (let i = 1; i <= 6; i++) {
            const input = document.getElementById('digit' + i);
            input.value = '';
        }
        document.getElementById('digit1').focus();
    }
</script>
</body>
</html>
